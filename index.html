<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.O.Company / BOSAX — Boris Orlov</title>
<style>
:root{--gold:#d89a24;--gold2:#f3bd4e;--text:#efe5d3;--line:rgba(216,154,36,.28)}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 70% 30%,rgba(216,125,24,.18),transparent 28%),radial-gradient(circle at 18% 25%,rgba(216,154,36,.14),transparent 26%),linear-gradient(90deg,#060504,#0b0806 42%,#050403);min-height:100vh}
a{text-decoration:none;color:inherit}.site{width:min(1500px,100%);margin:0 auto;padding:0 42px 32px}
header{height:76px;display:grid;grid-template-columns:330px 1fr 220px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{color:var(--gold2);font-weight:900;letter-spacing:5px;font-size:27px;line-height:1}.logo span{display:block;margin-top:7px;font-size:13px;letter-spacing:3px;color:#c6a15d}
nav{display:flex;justify-content:center;gap:34px;font-size:17px;color:#e4d7bf}nav a{padding:28px 0 25px;position:relative}.active{color:var(--gold2)}.active:after{content:"";position:absolute;height:2px;left:0;right:0;bottom:-1px;background:var(--gold2)}
.social{display:flex;justify-content:flex-end;gap:18px}.circle{width:42px;height:42px;border:1px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold2);font-weight:900}
.hero{display:grid;grid-template-columns:520px 1fr;gap:58px;min-height:650px;padding-top:28px}
.portrait{min-height:650px;overflow:hidden;background:#090705}
.portrait img{width:100%;height:650px;object-fit:cover;object-position:center top;display:block}
.hero-content{padding-top:52px}
h1{font-size:72px;margin:0 0 20px}
.lead{font-size:18px;line-height:1.6;color:#cfc2ad;max-width:720px}
.bottom-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;margin-top:20px;padding:0 10px}
.box{border:1px solid rgba(216,154,36,.22);border-radius:14px;background:rgba(9,8,7,.78);padding:24px 28px 28px}
.box h3{margin:0 0 18px;text-transform:uppercase}
.videos{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.thumb{height:120px;border-radius:8px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.video-title{font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div class="site">

<header>
<a href="#" class="logo">B.O.COMPANY<span>BOSAX MUSIC PROJECT</span></a>
<nav><a class="active" href="#">Главная</a></nav>
</header>

<section class="hero">
<div class="portrait"><img src="boris.jpg"></div>
<div class="hero-content">
<h1>BORIS ORLOV</h1>
<p class="lead">Музыкальный проект B.O.Company / BOSAX</p>
</div>
</section>

<section class="bottom-grid">

<div class="box" id="video">
<h3>Новые видео</h3>

<div class="videos">

<a class="video-card" href="https://youtu.be/UQuliBCN9o4" target="_blank">
<div class="thumb">
<img src="https://img.youtube.com/vi/UQuliBCN9o4/hqdefault.jpg">
</div>
<div class="video-title">Видео 1</div>
</a>

<a class="video-card" href="https://youtu.be/kwuQgkbq33Q" target="_blank">
<div class="thumb">
<img src="https://img.youtube.com/vi/kwuQgkbq33Q/hqdefault.jpg">
</div>
<div class="video-title">Видео 2</div>
</a>

<a class="video-card" href="https://youtu.be/9X2ZHzdreeQ" target="_blank">
<div class="thumb">
<img src="https://img.youtube.com/vi/9X2ZHzdreeQ/hqdefault.jpg">
</div>
<div class="video-title">Видео 3</div>
</a>

<a class="video-card" href="https://youtu.be/bPeFxM8MSo8" target="_blank">
<div class="thumb">
<img src="https://img.youtube.com/vi/bPeFxM8MSo8/hqdefault.jpg">
</div>
<div class="video-title">Видео 4</div>
</a>

</div>

</div>

</section>

</div>
</body>
</html>
